name: QA
on:
  push:
  pull_request:
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Cek otomatis repo (docs/16-qa-qc.md §A)
        run: python3 scripts/qa_check.py
      - name: Uji kalkulator fee
        run: |
          python3 scripts/hitung.py patungan 50000 bulanan
          python3 scripts/hitung.py jasa-bayar 100 16000
